name: CI & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-linux:
    name: Linux x86_64 (Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Run test suite and quality gates
        run: ./scripts/check.sh

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Package Linux archive
        run: |
          mkdir -p dist
          tar -czvf dist/bcvault-linux-x86_64.tar.gz -C target/release bcvault bcvault-fx

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcvault-linux-x86_64
          path: dist/bcvault-linux-x86_64.tar.gz

  build-windows:
    name: Windows x86_64 (Build)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Package Windows archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path target/release/bcvault.exe, target/release/bcvault-fx.exe -DestinationPath dist/bcvault-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcvault-windows-x86_64
          path: dist/bcvault-windows-x86_64.zip

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux release archive
        uses: actions/download-artifact@v4
        with:
          name: bcvault-linux-x86_64
          path: dist

      - name: Download Windows release archive
        uses: actions/download-artifact@v4
        with:
          name: bcvault-windows-x86_64
          path: dist

      - name: Generate release changelog
        id: changelog
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          echo "Previous tag: ${PREV_TAG}"
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"* %s (%h)" "${PREV_TAG}..${TAG}")
          else
            COMMITS=$(git log --pretty=format:"* %s (%h)" -n 50 "${TAG}")
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "Release ${TAG}"
            echo ""
            echo "### Changes"
            echo "${COMMITS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: |
            dist/bcvault-linux-x86_64.tar.gz
            dist/bcvault-windows-x86_64.zip
