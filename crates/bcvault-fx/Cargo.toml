[dependencies]
bcvault-core = { path = "../bcvault-core" }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
image = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
