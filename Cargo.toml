[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# GUI
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts", "glow", "persistence", "wayland", "x11",
] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio", "common-controls-v6"] }
open = "5"

# Async / network / parsing
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls", "json", "stream", "gzip", "brotli", "cookies", "http2",
] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Storage / files
rusqlite = { version = "0.37", features = ["bundled"] }
directories = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
lofty = "0.25"
dunce = "1.0"
strsim = "0.11"
unicode-normalization = "0.1"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev
wiremock = "0.6"
tempfile = "3"
pretty_assertions = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
